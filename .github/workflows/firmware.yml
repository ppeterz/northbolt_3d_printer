# Builds the printer and LED-board firmware. Pushing a tag that starts with "fw-" (for example
# fw-1.1.9.9-NB1) also publishes a GitHub release with the .hex files, which NORTHBOLT can install
# from its Settings -> Firmware screen.
name: Firmware

on:
  push:
    branches: [main]
    tags: ["fw-*"]
    paths: ["Marlin/**", "Atmega_Soft/**", "platformio.ini", ".github/workflows/firmware.yml"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build printer firmware (MKS Gen 1.3)
        run: pio run -e skriware2

      - name: Build LED and scale board firmware
        run: pio run -d Atmega_Soft/led_and_scale -e atmega328

      - name: Name the files after the tag
        run: |
          name="${GITHUB_REF_NAME#fw-}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) name="build-${GITHUB_SHA::7}";; esac
          mkdir out
          cp .pio/build/skriware2/firmware.hex "out/skriware2-printer-${name}.hex"
          cp Atmega_Soft/led_and_scale/.pio/build/atmega328/firmware.hex "out/led-scale-board-${name}.hex"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/*.hex

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/fw-')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.hex
          body_path: FIRMWARE_SAFETY_FIXES.md
