; Build the Skriware 2 printer firmware (MKS Gen 1.3, ATmega2560) with PlatformIO:
;   pio run -e skriware2              -> .pio/build/skriware2/firmware.hex
;   pio run -e skriware2 -t upload    (board on USB)
; See FIRMWARE_SAFETY_FIXES.md.
[platformio]
src_dir = Marlin
default_envs = skriware2

[env:skriware2]
platform = atmelavr
framework = arduino
board = megaatmega2560
lib_deps = paulstoffregen/OneWire@^2.3.7
lib_ldf_mode = chain+
build_flags = -fmax-errors=10
upload_speed = 115200
