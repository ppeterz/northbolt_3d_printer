; Build the LED/scale board sketch (ATmega328P, Uno-compatible):
;   pio run -e atmega328              -> .pio/build/atmega328/firmware.hex
; It has no USB port: flash it with an ISP programmer. See FIRMWARE_SAFETY_FIXES.md.
[platformio]
src_dir = .

[env:atmega328]
platform = atmelavr
framework = arduino
board = uno
