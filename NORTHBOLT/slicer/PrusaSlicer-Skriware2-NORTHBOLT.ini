# PrusaSlicer config bundle for the Skriware 2 with NORTHBOLT (made and test-sliced with PrusaSlicer 2.9).
# Import: File > Import > Import Config Bundle. See NORTHBOLT/README.md, "Two-colour printing".
#
# The printer's firmware does the whole nozzle swap on T0/T1: it lifts Z, lowers or raises the right
# nozzle and applies its X offset (-30.5 mm) and Z offset. So the extruder offsets here are 0, and the
# two-colour bed is 179 mm wide: the right nozzle can't reach further than X 179.5.
# PrusaSlicer 2.9 keeps the wipe tower's position with the project: drag it onto the bed, or press A.
# No start-of-print priming: on this firmware its pause (M1) would wait for a button that isn't there.

[print:0.20mm NORTHBOLT]
layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = gyroid
skirts = 1
skirt_distance = 4
skirt_height = 1
brim_width = 0
support_material = 0
perimeter_speed = 40
small_perimeter_speed = 25
external_perimeter_speed = 30
infill_speed = 60
solid_infill_speed = 45
top_solid_infill_speed = 30
gap_fill_speed = 30
bridge_speed = 30
travel_speed = 120
first_layer_speed = 20
avoid_crossing_perimeters = 0
wipe_tower = 1
wipe_tower_width = 30
wipe_tower_brim_width = 2
wipe_tower_bridging = 10
single_extruder_multi_material_priming = 0
ooze_prevention = 0
interface_shells = 0
gcode_label_objects = octoprint
gcode_comments = 0
output_filename_format = {input_filename_base}_{layer_height}mm_{filament_type[0]}_{print_time}.gcode
compatible_printers_condition = printer_notes=~/.*NORTHBOLT.*/

[filament:PLA NORTHBOLT]
filament_type = PLA
filament_diameter = 1.75
filament_density = 1.24
extrusion_multiplier = 1
temperature = 200
first_layer_temperature = 205
bed_temperature = 60
first_layer_bed_temperature = 60
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1
fan_below_layer_time = 60
slowdown_below_layer_time = 10
min_print_speed = 10
filament_colour = #FFFFFF
compatible_printers_condition = printer_notes=~/.*NORTHBOLT.*/

[filament:PETG NORTHBOLT]
filament_type = PETG
filament_diameter = 1.75
filament_density = 1.27
extrusion_multiplier = 1
temperature = 235
first_layer_temperature = 235
bed_temperature = 80
first_layer_bed_temperature = 80
cooling = 1
fan_always_on = 1
min_fan_speed = 30
max_fan_speed = 50
bridge_fan_speed = 100
disable_fan_first_layers = 3
fan_below_layer_time = 60
slowdown_below_layer_time = 10
min_print_speed = 10
filament_colour = #FFFFFF
compatible_printers_condition = printer_notes=~/.*NORTHBOLT.*/

[printer:Skriware 2 - two colours (NORTHBOLT)]
printer_technology = FFF
printer_notes = NORTHBOLT Skriware 2 two colours
bed_shape = 0x0,179x0,179x275,0x275
max_print_height = 200
gcode_flavor = marlin
use_relative_e_distances = 1
use_firmware_retraction = 0
remaining_times = 1
machine_limits_usage = time_estimate_only
thumbnails = 16x16/PNG, 220x124/PNG
nozzle_diameter = 0.4,0.4
extruder_offset = 0x0,0x0
extruder_colour = "#FFFFFF";"#E2001A"
min_layer_height = 0.07,0.07
max_layer_height = 0.3,0.3
retract_length = 2,2
retract_speed = 35,35
deretract_speed = 0,0
retract_lift = 0.4,0.4
retract_lift_below = 199,199
retract_before_travel = 1.5,1.5
retract_layer_change = 1,1
retract_length_toolchange = 4,4
retract_restart_extra_toolchange = 0,0
multimaterial_purging = 50
wipe = 0,0
start_gcode = ; Skriware 2, two colours (NORTHBOLT). NORTHBOLT heats at the back left corner first.\nM140 S{first_layer_bed_temperature[initial_tool]}\n{if is_extruder_used[0]}M104 T0 S{first_layer_temperature[0]}\n{endif}{if is_extruder_used[1]}M104 T1 S{first_layer_temperature[1]}\n{endif}M190 S{first_layer_bed_temperature[initial_tool]}\n{if is_extruder_used[0]}M109 T0 S{first_layer_temperature[0]}\n{endif}{if is_extruder_used[1]}M109 T1 S{first_layer_temperature[1]}\n{endif}G28 ; home all, Z with the probe\nM420 S1 ; bed mesh on\nG90\nM83 ; relative E, which the wipe tower needs\nT{initial_tool}\nG92 E0\nG1 Z0.3 F600\nG1 X5 Y5 F3000\nG1 X80 Y5 E8 F1200 ; purge line\nG92 E0
end_gcode = ; end\nM104 T0 S0\nM104 T1 S0\nM140 S0\nM107\nG91\nG1 Z10 F600\nG90\nG28 X Y\nM84
before_layer_gcode =
layer_gcode = G92 E0
toolchange_gcode =

[printer:Skriware 2 - left nozzle (NORTHBOLT)]
printer_technology = FFF
printer_notes = NORTHBOLT Skriware 2 left nozzle
bed_shape = 0x0,200x0,200x275,0x275
max_print_height = 200
gcode_flavor = marlin
use_relative_e_distances = 0
use_firmware_retraction = 0
remaining_times = 1
machine_limits_usage = time_estimate_only
thumbnails = 16x16/PNG, 220x124/PNG
nozzle_diameter = 0.4
extruder_offset = 0x0
extruder_colour = "#FFFFFF"
min_layer_height = 0.07
max_layer_height = 0.3
retract_length = 2
retract_speed = 35
deretract_speed = 0
retract_lift = 0.4
retract_lift_below = 199
retract_before_travel = 1.5
retract_layer_change = 1
wipe = 0
start_gcode = ; Skriware 2, left nozzle (NORTHBOLT). NORTHBOLT heats at the back left corner first.\nM140 S[first_layer_bed_temperature]\nM104 T0 S[first_layer_temperature]\nM190 S[first_layer_bed_temperature]\nM109 T0 S[first_layer_temperature]\nG28 ; home all, Z with the probe\nM420 S1 ; bed mesh on\nG90\nM82\nT0\nG92 E0\nG1 Z0.3 F600\nG1 X5 Y5 F3000\nG1 X80 Y5 E8 F1200 ; purge line\nG92 E0
end_gcode = ; end\nM104 T0 S0\nM140 S0\nM107\nG91\nG1 Z10 F600\nG90\nG28 X Y\nM84
before_layer_gcode =
layer_gcode =
toolchange_gcode =

[presets]
print = 0.20mm NORTHBOLT
filament = PLA NORTHBOLT
filament_1 = PLA NORTHBOLT
printer = Skriware 2 - two colours (NORTHBOLT)
